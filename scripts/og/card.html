<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* The same self-hosted brand fonts the site ships (public/fonts) */
  @font-face{font-family:'Playfair Display';font-style:normal;font-weight:700;font-display:block;src:url('../../public/fonts/playfair-display-latin-700-normal.woff2') format('woff2')}
  @font-face{font-family:'Playfair Display';font-style:italic;font-weight:700;font-display:block;src:url('../../public/fonts/playfair-display-latin-700-italic.woff2') format('woff2')}
  @font-face{font-family:'DM Sans';font-style:normal;font-weight:500;font-display:block;src:url('../../public/fonts/dm-sans-latin-500-normal.woff2') format('woff2')}
  @font-face{font-family:'DM Sans';font-style:normal;font-weight:600;font-display:block;src:url('../../public/fonts/dm-sans-latin-600-normal.woff2') format('woff2')}
  /* Tokens mirror src/index.css exactly: paper, ink, secondary, faint, hairline, primary, quadrants */
  :root{
    --paper:#FAF7F3; --ink:#1C1F24; --secondary:#575C63; --faint:#8A8F96;
    --hairline:#E7E0D8; --primary:#C41E3A;
    --q-structure:#C41E3A; --q-people:#4A5568; --q-process:#2D3748; --q-mindset:#9C6B72;
  }
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:var(--paper);overflow:hidden}
  body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);position:relative}
  /* Text column on the left; the portrait runs full height on the right */
  .card{position:absolute;top:0;bottom:0;left:0;width:800px;padding:72px 56px 64px 80px;display:flex;flex-direction:column}
  .photo{position:absolute;top:0;right:0;bottom:0;width:400px;overflow:hidden;border-left:1px solid var(--hairline)}
  /* Tight head-and-shoulders: at LinkedIn feed size (~550px wide) the face must still read */
  .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block;transform:scale(1.5);transform-origin:49% 16%}
  .top{display:flex;align-items:center;gap:16px}
  .mark{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:36px;height:36px;flex-shrink:0}
  .mark span:nth-child(1){background:var(--q-structure)}
  .mark span:nth-child(2){background:var(--q-people)}
  .mark span:nth-child(3){background:var(--q-mindset)}
  .mark span:nth-child(4){background:var(--q-process)}
  .name{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:32px;letter-spacing:-.2px}
  .eyebrow{margin-top:44px;color:var(--primary);font-weight:600;font-size:17px;letter-spacing:.16em;text-transform:uppercase}
  h1{margin-top:18px;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:66px;line-height:1.07;letter-spacing:-.8px}
  h1 em{color:var(--primary);font-style:italic}
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
  .rule{width:110px;height:4px;background:var(--primary)}
  .url{color:var(--faint);font-weight:500;font-size:20px;letter-spacing:.02em}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="name">Eric Yim</div>
    </div>
    <p class="eyebrow">Organization design strategist · Singapore</p>
    <h1>I design organizations as <em>systems</em> that leaders can run.</h1>
    <div class="foot">
      <div class="rule"></div>
      <div class="url">www.ericyim.sg</div>
    </div>
  </div>
  <div class="photo"><img src="../../public/images/eric-yim.jpg" alt=""></div>
</body>
</html>
