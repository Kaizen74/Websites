<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@500;600&display=block">
<style>
  /* Tokens mirror src/index.css exactly: paper, ink, secondary, faint, hairline, primary, quadrants */
  :root{
    --paper:#FAF7F3; --ink:#1C1F24; --secondary:#575C63; --faint:#8A8F96;
    --hairline:#E7E0D8; --primary:#C41E3A;
    --q-structure:#C41E3A; --q-people:#4A5568; --q-process:#2D3748; --q-mindset:#9C6B72;
  }
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:var(--paper);overflow:hidden}
  body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);position:relative}
  .card{position:absolute;inset:0;padding:78px 86px 70px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:18px}
  .mark{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:40px;height:40px;flex-shrink:0}
  .mark span:nth-child(1){background:var(--q-structure)}
  .mark span:nth-child(2){background:var(--q-people)}
  .mark span:nth-child(3){background:var(--q-mindset)}
  .mark span:nth-child(4){background:var(--q-process)}
  .name{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:32px;letter-spacing:-.2px}
  .eyebrow{margin-top:54px;color:var(--primary);font-weight:600;font-size:19px;letter-spacing:.17em;text-transform:uppercase}
  h1{margin-top:22px;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:84px;line-height:1.06;letter-spacing:-1px;max-width:1040px}
  h1 em{color:var(--primary);font-style:italic}
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
  .rule{width:120px;height:4px;background:var(--primary)}
  .url{color:var(--faint);font-weight:500;font-size:21px;letter-spacing:.02em}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="name">Eric Yim</div>
    </div>
    <p class="eyebrow">Organization design strategist · Singapore</p>
    <h1>Leaders don’t need another report. They need a <em>system</em>.</h1>
    <div class="foot">
      <div class="rule"></div>
      <div class="url">www.ericyim.sg</div>
    </div>
  </div>
</body>
</html>
